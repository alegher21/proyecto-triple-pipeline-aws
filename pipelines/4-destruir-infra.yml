name: Limpieza - Destruir Infraestructura
on:
  workflow_dispatch:

jobs:
  destruir:
    name: terraform destroy
    runs-on: ubuntu-latest
    environment: produccion-infra
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Destruir recursos (apaga ECS Fargate)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -reconfigure -backend-config="bucket=devops-final-tfstate-${ACCOUNT_ID}" -backend-config="key=triple-pipeline/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform destroy -auto-approve
